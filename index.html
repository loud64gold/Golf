<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE6">
<title>Golf · Scorecard</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --creme: #F4EFE6;
    --creme-fonce: #E9E1D2;
    --sauge: #7D8F7A;
    --sauge-fonce: #566852;
    --terracotta: #B0593A;
    --encre: #2F2B26;
    --gris: #6F695F;
    --blanc: #FBF9F4;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--creme);
    color: var(--encre);
    padding: env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 28px; letter-spacing: -0.2px; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 19px; margin-bottom: 12px; }
  header.page { padding: 22px 4px 14px; }
  .sous { color: var(--gris); font-size: 14px; margin-top: 4px; }

  .carte {
    background: var(--blanc);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(47,43,38,0.06);
  }
  .carte.reprise { border-left: 4px solid var(--sauge-fonce); }
  label { font-size: 13px; color: var(--gris); display: block; margin-bottom: 6px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 11px 12px;
    border: 1px solid var(--creme-fonce);
    border-radius: 10px;
    background: var(--creme);
    color: var(--encre);
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--sauge); border-color: transparent; }
  .champ + .champ { margin-top: 12px; }
  .rangee { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .rangee > * { flex: 1; }
  .rangee.trois .btn { font-size: 13px; padding: 10px 6px; }

  .btn { padding: 13px 14px; border-radius: 12px; border: none; font: inherit; font-size: 15px; cursor: pointer; }
  .btn.principal { background: var(--sauge-fonce); color: #fff; }
  .btn.secondaire { background: var(--creme-fonce); color: var(--encre); }
  .btn.danger { background: transparent; color: var(--terracotta); border: 1px solid var(--terracotta); }
  .btn.plein { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .lien { background: none; border: none; font: inherit; font-size: 13px; color: var(--sauge-fonce); text-decoration: underline; padding: 6px 2px; cursor: pointer; }
  .lien.danger { color: var(--terracotta); }
  .note { font-size: 13px; color: var(--gris); margin-top: 8px; line-height: 1.4; }

  .segment { display: flex; gap: 6px; }
  .segment button {
    flex: 1; padding: 11px 0; border: 1px solid var(--creme-fonce); background: var(--creme);
    border-radius: 10px; font: inherit; font-size: 16px; color: var(--encre); cursor: pointer;
  }
  .segment button.on { background: var(--sauge-fonce); border-color: var(--sauge-fonce); color: #fff; }
  details summary { cursor: pointer; font-size: 14px; color: var(--gris); }
  .liste-drills { margin: 10px 0 0 18px; font-size: 15px; line-height: 1.5; }

  .segment.wrap { flex-wrap: wrap; }
  .segment.wrap button { flex: 1 0 28%; }

  /* Mes clubs (accueil) */
  .groupe-clubs + .groupe-clubs { margin-top: 14px; }
  .lib-groupe { font-size: 12px; color: var(--gris); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .puce { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--creme-fonce); background: var(--creme); color: var(--encre); font: inherit; font-size: 15px; cursor: pointer; }
  .puce.on { background: var(--sauge-fonce); border-color: var(--sauge-fonce); color: #fff; }

  /* Page partie */
  .entete-trou { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .btn-nav { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--creme-fonce); color: var(--encre); font-size: 22px; cursor: pointer; }
  .btn-nav:disabled { opacity: 0.35; }
  .num-trou { text-align: center; }
  .num-trou .grand { font-family: Georgia, serif; font-size: 42px; line-height: 1; }
  .num-trou .petit { font-size: 13px; color: var(--gris); margin-top: 4px; }
  .pastilles { display: flex; gap: 6px; overflow-x: auto; padding: 2px 4px 12px; margin: 0 -4px; scrollbar-width: none; }
  .pastilles::-webkit-scrollbar { display: none; }
  .pastille {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--creme-fonce); background: var(--blanc);
    font: inherit; font-size: 13px; color: var(--gris); cursor: pointer;
  }
  .pastille.joue { background: var(--creme-fonce); color: var(--encre); }
  .pastille.actif { background: var(--sauge-fonce); border-color: var(--sauge-fonce); color: #fff; }

  .grille-clubs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grille-clubs button {
    padding: 16px 4px; border-radius: 12px; border: none; background: var(--sauge-fonce);
    color: #fff; font: inherit; font-size: 16px; cursor: pointer;
  }
  .grille-clubs button.putter { background: var(--creme-fonce); color: var(--encre); }
  .grille-clubs button.pen { background: transparent; color: var(--terracotta); border: 1px solid var(--terracotta); }
  .grille-clubs button.sel { background: var(--terracotta); color: #fff; box-shadow: 0 0 0 3px rgba(176,89,58,0.28); }
  .prec { background: var(--creme); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .prec b { font-weight: 600; }
  .grille-clubs button:active { transform: scale(0.97); }

  .score-trou { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
  .score-trou .gros { font-family: Georgia, serif; font-size: 36px; line-height: 1; }
  .coups { list-style: none; }
  .coup { display: grid; grid-template-columns: 28px 1fr 36px; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--creme-fonce); }
  .coup:last-child { border-bottom: none; }
  .coup .n { color: var(--gris); font-size: 14px; text-align: center; }
  .coup .l1 { display: flex; justify-content: space-between; gap: 8px; }
  .coup .l1 b { font-weight: 600; }
  .coup .gps { display: block; font-size: 12px; color: var(--gris); margin-top: 2px; }
  .coup .x { width: 36px; height: 36px; border: none; background: transparent; color: var(--gris); font-size: 20px; cursor: pointer; }
  /* Plan du trou */
  svg.plan { display: block; width: 100%; height: auto; border-radius: 10px; }
  .plan .fond { fill: #E5EADD; }
  .plan .hors { fill: #5F7459; }
  .plan .rough { fill: #9DAE91; fill-rule: evenodd; }
  .plan .fw { fill: #CADEB1; fill-rule: evenodd; }
  .plan .zt { fill: #DCEAC0; stroke: #8FA486; stroke-width: 0.8; }
  .plan .zg { fill: #E4F1C9; stroke: #6F8A66; stroke-width: 1; }
  .plan .bk { fill: #EADFBE; stroke: #C4B386; stroke-width: 0.8; fill-rule: evenodd; }
  .plan .eau { fill: #BCD8E4; stroke: #7FA9BE; stroke-width: 0.8; fill-rule: evenodd; }
  .plan .couloir { stroke: #CADEB1; stroke-linejoin: round; stroke-linecap: round; opacity: 0.85; }
  .plan .ligne-jeu { stroke: #3E5238; stroke-width: 1.8; stroke-dasharray: 6 4; stroke-linejoin: round; opacity: 0.9; }
  .plan .coude { fill: #3E5238; stroke: #fff; stroke-width: 1; }
  .plan .ext { opacity: 0.5; }
  .plan .axe { stroke: var(--sauge-fonce); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.7; }
  .plan .trace { fill: none; stroke: var(--terracotta); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .plan .tee { fill: var(--encre); }
  .plan .green { fill: var(--sauge-fonce); stroke: #fff; stroke-width: 2; }
  .plan .mat { stroke: var(--encre); stroke-width: 1.5; }
  .plan .fanion { fill: var(--terracotta); stroke: #fff; stroke-width: 0.6; }
  .plan .halo { fill: none; stroke: #fff; stroke-width: 2; opacity: 0.8; }
  .plan .marq { fill: var(--terracotta); stroke: #fff; stroke-width: 1.5; }
  .plan .marq.putt { fill: var(--gris); }
  .plan .num { fill: #fff; font: 600 9px -apple-system, Arial, sans-serif; text-anchor: middle; }
  .plan .lbl { fill: var(--encre); font: 10px -apple-system, Arial, sans-serif; text-anchor: middle; paint-order: stroke; stroke: rgba(244,239,230,0.92); stroke-width: 3; stroke-linejoin: round; }
  .plan .lbl.gauche { text-anchor: start; }
  .plan .lbl.droite { text-anchor: end; }
  .plan .echelle { stroke: var(--encre); stroke-width: 1.5; }
  .plan .echelle-fond { stroke: rgba(244,239,230,0.92); stroke-width: 4; stroke-linecap: round; }
  .plan-vide { background: var(--creme); border-radius: 10px; padding: 28px 16px; text-align: center; color: var(--gris); font-size: 14px; line-height: 1.4; }
  .note a { color: var(--sauge-fonce); }
  .alerte { background: #F3E1D7; color: #7A3A22; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; margin-bottom: 14px; }

  /* Synthèse */
  .tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; text-align: center; }
  .tuile .val { font-family: Georgia, serif; font-size: 28px; line-height: 1.1; }
  .tuile .lib { font-size: 12px; color: var(--gris); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--creme-fonce); }
  th { color: var(--gris); font-weight: 500; font-size: 12px; }
  td.g, th.g { text-align: left; }
  tr.total td { font-weight: 600; border-bottom: none; }
  .barres { display: flex; gap: 2px; height: 130px; position: relative; }
  .barres::before { content: ""; position: absolute; left: 0; right: 0; top: 70px; height: 1px; background: var(--creme-fonce); }
  .bcol { flex: 1; position: relative; height: 100%; }
  .bcol span { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--gris); }
  .b { position: absolute; left: 12%; right: 12%; border-radius: 3px; }
  .b.haut { bottom: 60px; background: var(--terracotta); }
  .b.bas { top: 70px; background: var(--sauge); }
  .b.zero { top: 69px; height: 3px; background: var(--gris); }
  .recap { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--creme); border-radius: 10px; padding: 12px; margin-top: 12px; }

  /* Barre d'onglets */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px;
    background: var(--blanc); border-top: 1px solid var(--creme-fonce);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button { flex: 1; max-width: 180px; padding: 10px 4px; border: none; background: transparent; font: inherit; font-size: 14px; color: var(--gris); border-radius: 10px; cursor: pointer; }
  #tabs button.actif { background: var(--creme-fonce); color: var(--encre); font-weight: 600; }
  #tabs button:disabled { opacity: 0.4; }

  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--encre); color: var(--blanc); padding: 10px 16px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.visible { opacity: 1; }
</style>
</head>
<body>

<main id="app"></main>

<nav id="tabs">
  <button data-action="vue" data-v="accueil">Accueil</button>
  <button data-action="vue" data-v="partie">Partie</button>
  <button data-action="vue" data-v="synthese">Synthèse</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

const CLE = "golf-v2";
const CLUBS_DEFAUT = ["Driver", "Hybride", "Fer 7", "Fer 9", "PW", "SW", "Putter"];
const PENALITE = "Pénalité";
const estPutt = c => /putter/i.test(c);

// Clubs proposés dans « Mes clubs » (ordre = ordre d'affichage sur la page Partie)
// Largeur (m) du couloir schématique tracé le long de la ligne de jeu OSM quand le fairway n'est pas cartographié (0 = aucun)
const COULOIR_M = 0;
const CLUBS_GROUPES = [
  ["Bois", ["Driver", "Bois 3", "Bois 5"]],
  ["Hybrides", ["Hybride", "Hybride 3", "Hybride 4", "Hybride 5"]],
  ["Fers", ["Fer 3", "Fer 4", "Fer 5", "Fer 6", "Fer 7", "Fer 8", "Fer 9"]],
  ["Wedges", ["PW", "GW", "SW", "LW"]],
  ["Putter", ["Putter"]]
];
const CLUBS_CONNUS = CLUBS_GROUPES.reduce((a, g) => a.concat(g[1]), []);
function ordonnerClubs(liste) {
  const l = [...new Set(liste.filter(c => c && c !== PENALITE))];
  if (!l.some(estPutt)) l.push("Putter");
  return CLUBS_CONNUS.filter(c => l.includes(c)).concat(l.filter(c => !CLUBS_CONNUS.includes(c)));
}

/* ---------- État ---------- */
function etatInitial() {
  return { golfs: [], golfId: null, clubs: [...CLUBS_DEFAUT], objectifScore: "", drills: "", partie: null, vue: "accueil", catalogue: [], releves: {}, departs: {} };
}
function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) {
      const e = Object.assign(etatInitial(), JSON.parse(brut));
      e.clubs = ordonnerClubs(Array.isArray(e.clubs) ? e.clubs : CLUBS_DEFAUT);
      if (e.partie) e.partie.trous.forEach(t => t.coups.forEach(c => { if (c.gps === "attente") c.gps = "echec"; }));
      return e;
    }
  } catch (err) {}
  return etatInitial();
}
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }

let S = charger();
const ui = { proche: "", distGreen: null, clubChoisi: null, catMsg: "" };
const app = document.getElementById("app");

/* Contours des trous (fichiers contours/<golf>.json, issus d'OpenStreetMap), gardés sur l'appareil pour jouer hors ligne */
const CLE_CONTOURS = "golf-v2-contours";
function lireContours() { try { return JSON.parse(localStorage.getItem(CLE_CONTOURS)) || {}; } catch (e) { return {}; } }
let CONTOURS = lireContours();
const contoursEnCours = new Set();

/* ---------- Utilitaires ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 1) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d });
const signe = d => d === 0 ? "E" : d > 0 ? "+" + d : String(d);
const dateLongue = d => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const pluriel = (n, mot) => n + " " + mot + (n > 1 ? "s" : "");

function toast(m, ms = 2000) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.classList.add("visible");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("visible"), ms);
}

function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function position() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko({ code: 0 });
    navigator.geolocation.getCurrentPosition(ok, ko, { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 });
  });
}

/* ---------- Catalogue (golfs.json) ---------- */
function catGolf(id) { return (S.catalogue || []).find(c => c.id === id) || null; }
function catTrous(id) { const c = catGolf(id); return c && Array.isArray(c.trous) && c.trous.length ? c.trous : null; }

// Golfs du catalogue (golfs.json). Un golf sans données de trous garde les pars/distances
// saisis dans S.golfs (entrée de même id).
function listeGolfs() {
  return (S.catalogue || []).map(c => {
    const n = c.nbTrous || (c.trous && c.trous.length) || 18;
    const ov = S.golfs.find(x => x.id === c.id);
    const holes = ov && ov.holes && ov.holes.length === n ? ov.holes : Array.from({ length: n }, () => ({ par: 4, distance: "" }));
    return { id: c.id, nom: c.nom, nbTrous: n, holes, lat: c.lat != null ? c.lat : null, lng: c.lng != null ? c.lng : null };
  });
}
function golfCourant() { return listeGolfs().find(g => g.id === S.golfId) || null; }

function departsDe(id) { const t = catTrous(id); return t ? Object.keys(t[0].distances || {}) : []; }
function departChoisi(id) {
  const d = departsDe(id);
  if (!d.length) return null;
  const c = S.departs[id];
  return d.includes(c) ? c : (d.includes("jaune") ? "jaune" : d[0]);
}
function longueurDepart(id, dep) {
  const t = catTrous(id);
  if (!t || !dep) return null;
  let s = 0;
  for (const h of t) { const v = h.distances && h.distances[dep]; if (v == null) return null; s += v; }
  return s;
}
function parTotal(id) { const t = catTrous(id); return t ? t.reduce((s, h) => s + h.par, 0) : null; }

function departBloc(g) {
  const deps = departsDe(g.id);
  if (!deps.length) return "";
  const cur = departChoisi(g.id), L = longueurDepart(g.id, cur), P = parTotal(g.id);
  if (deps.length === 1) return `<div class="champ"><p class="note">Départ ${esc(deps[0])}${L != null ? " · " + L + " m" : ""} · par ${P}</p></div>`;
  const lib = d => d.charAt(0).toUpperCase() + d.slice(1);
  return `<div class="champ"><label>Départ</label><div class="segment wrap">${deps.map(d =>
      `<button data-action="depart" data-v="${esc(d)}" class="${d === cur ? "on" : ""}">${esc(lib(d))}</button>`).join("")}</div>
    <p class="note">${L != null ? L + " m · " : ""}par ${P}</p></div>`;
}

// Position d'un tee/green : relevé fait avec l'appli en priorité, sinon catalogue
function pointTrou(id, n, type) {
  const r = S.releves[id] && S.releves[id][n] && S.releves[id][n][type];
  if (r) return r;
  const t = catTrous(id), h = t && t[n - 1];
  if (h && h[type] && h[type].lat != null) return h[type];
  const c = CONTOURS[id], o = c && Array.isArray(c.trous) ? c.trous.find(x => x.n === n) : null;
  return o && o[type] ? { lat: o[type][0], lng: o[type][1], src: "osm" } : null;
}

/* Plan du trou : schéma SVG. Fond = contours OpenStreetMap du golf quand ils sont disponibles
   (limites du parcours, fairway, départs, green, bunkers) ; par-dessus, tes coups validés :
   points numérotés reliés par un trait. Projection locale à plat ; tee à gauche et green à droite
   quand ils sont connus, sinon nord en haut. Aucun relief ni arbre. */
function planSvg(p, i) {
  const n = i + 1, t = p.trous[i];
  const Cc = CONTOURS[p.golfId];
  const CH = Cc && Array.isArray(Cc.trous) && Array.isArray(Cc.formes) && Array.isArray(Cc.limite)
    ? Cc.trous.find(h => h.n === n && h.tee && h.green && Array.isArray(h.ligne)) || null : null;
  const tee = pointTrou(p.golfId, n, "tee"), gr = pointTrou(p.golfId, n, "green");
  const pts = [];
  if (tee) pts.push({ type: "tee", lat: tee.lat, lng: tee.lng });
  if (gr) pts.push({ type: "green", lat: gr.lat, lng: gr.lng });
  t.coups.forEach((c, k) => {
    if (c.club !== PENALITE && c.lat != null) pts.push({ type: "coup", k, club: c.club, lat: c.lat, lng: c.lng });
  });
  if (!pts.length) {
    return { vide: true, tourne: false, longueur: null, carte: false,
      html: `<div class="plan-vide">Le plan se dessinera à partir de tes positions : valide un coup, ou relève le tee et le green.</div>` };
  }

  // Projection locale (en mètres) autour d'une origine
  const lat0 = CH ? CH.tee[0] : pts.reduce((a, q) => a + q.lat, 0) / pts.length;
  const lng0 = CH ? CH.tee[1] : pts.reduce((a, q) => a + q.lng, 0) / pts.length;
  const K = 111195, cl = Math.cos(lat0 * Math.PI / 180);
  const proj = (lat, lng) => ({ x: (lng - lng0) * K * cl, y: (lat - lat0) * K });
  pts.forEach(q => Object.assign(q, proj(q.lat, q.lng)));
  const T = pts.find(q => q.type === "tee"), G = pts.find(q => q.type === "green");

  // Orientation : axe tee → green de la carte s'il existe, sinon celui des positions connues
  let ex = 1, ey = 0, tourne = false;
  const axe = CH ? [proj(CH.tee[0], CH.tee[1]), proj(CH.green[0], CH.green[1])] : T && G ? [T, G] : null;
  if (axe) {
    const dx = axe[1].x - axe[0].x, dy = axe[1].y - axe[0].y, L = Math.hypot(dx, dy);
    if (L >= 1) { ex = dx / L; ey = dy / L; tourne = true; }
  }
  const rot = q => ({ a: q.x * ex + q.y * ey, c: q.y * ex - q.x * ey });
  pts.forEach(q => Object.assign(q, rot(q)));

  // Ce qui cadre le dessin : tes positions + le trou courant (pas les trous voisins)
  const cadre = pts.map(q => [q.a, q.c]);
  const ajoute = ll => { const r = rot(proj(ll[0], ll[1])); cadre.push([r.a, r.c]); };
  if (CH) {
    CH.ligne.forEach(ajoute);
    Cc.formes.forEach(x => { if (x.n === n && x.r[0]) x.r[0].forEach(ajoute); });
  }
  const A = cadre.map(c => c[0]), B = cadre.map(c => c[1]);
  const a0 = Math.min(...A), a1 = Math.max(...A), c0 = Math.min(...B), c1 = Math.max(...B);
  const W = 340, mx = 30, my = CH ? 24 : 34, larg = Math.max(a1 - a0, 60), haut = Math.max(c1 - c0, 40);
  let H = 150, s = Math.min((W - 2 * mx) / larg, (H - 2 * my) / haut);
  if (CH) {
    s = Math.min((W - 2 * mx) / larg, (230 - 2 * my) / haut);
    H = Math.max(120, Math.min(230, Math.round(haut * s + 2 * my)));
  }
  const aMid = (a0 + a1) / 2, cMid = (c0 + c1) / 2;
  const X = a => W / 2 + (a - aMid) * s, Y = c => H / 2 - (c - cMid) * s;
  const f = v => v.toFixed(1);
  pts.forEach(q => { q.X = X(q.a); q.Y = Y(q.c); });
  const sv = ll => { const r = rot(proj(ll[0], ll[1])); return f(X(r.a)) + "," + f(Y(r.c)); };
  const chemin = rings => rings.map(r => "M" + r.map(sv).join("L") + "Z").join("");
  const visible = r0 => {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    r0.forEach(ll => { const r = rot(proj(ll[0], ll[1])), x = X(r.a), y = Y(r.c); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
    return x1 > -20 && x0 < W + 20 && y1 > -20 && y0 < H + 20;
  };
  const etiq = (q, txt) => `<text class="lbl" x="${f(q.X)}" y="${f(q.Y + 22)}">${txt}</text>`;

  let g = "";
  if (CH) {
    g += `<rect class="hors" x="0" y="0" width="${W}" height="${H}" rx="10"/>`
      + `<path class="rough" d="${Cc.limite.map(chemin).join("")}"/>`;
    // trous voisins estompés, trou courant au premier plan
    const couche = (type, cls) => {
      const L = Cc.formes.filter(x => x.t === type && x.r[0] && visible(x.r[0]));
      return L.filter(x => x.n !== n).map(x => `<path class="${cls} ext" d="${chemin(x.r)}"/>`).join("")
        + L.filter(x => x.n === n).map(x => `<path class="${cls}" d="${chemin(x.r)}"/>`).join("");
    };
    const sansFw = !Cc.formes.some(x => x.t === "fw" && x.n === n);
    if (sansFw && COULOIR_M > 0) g += `<polyline class="couloir" fill="none" stroke-width="${f(COULOIR_M * s)}" points="${CH.ligne.map(sv).join(" ")}"/>`;
    g += couche("fw", "fw") + couche("tee", "zt") + couche("gr", "zg") + couche("wa", "eau") + couche("bk", "bk");
    // sans fairway dans les données OSM : on trace la ligne de jeu du trou (axe tee → green) pour lire le parcours
    if (sansFw) g += `<polyline class="ligne-jeu" fill="none" points="${CH.ligne.map(sv).join(" ")}"/>`
      + CH.ligne.slice(1, -1).map(ll => { const [px, py] = sv(ll).split(","); return `<circle class="coude" cx="${px}" cy="${py}" r="2.8"/>`; }).join("");
  } else {
    g += `<rect class="fond" x="0" y="0" width="${W}" height="${H}" rx="10"/>`;
    if (tourne) {
      g += `<line class="axe" x1="${f(T.X)}" y1="${f(T.Y)}" x2="${f(G.X)}" y2="${f(G.Y)}"/>`
        + `<text class="lbl" x="${f((T.X + G.X) / 2)}" y="${f(T.Y - 8)}">${Math.round(distanceM(T.lat, T.lng, G.lat, G.lng))} m</text>`;
    }
  }
  if (T) {
    const w = CH ? 8 : 12;
    g += `<rect class="tee" x="${f(T.X - w / 2)}" y="${f(T.Y - w / 2)}" width="${w}" height="${w}" rx="2"/>${etiq(T, "Tee")}`;
  }
  if (G) {
    if (!CH) g += `<circle class="green" cx="${f(G.X)}" cy="${f(G.Y)}" r="8"/>`;
    g += `<line class="mat" x1="${f(G.X)}" y1="${f(G.Y)}" x2="${f(G.X)}" y2="${f(G.Y - 18)}"/>`
      + `<path class="fanion" d="M${f(G.X)} ${f(G.Y - 18)} l10 4.5 l-10 4.5z"/>${etiq(G, "Green")}`;
  }

  // Trajectoire : coups validés, numérotés comme dans la liste, reliés dans l'ordre
  const cp = pts.filter(q => q.type === "coup");
  if (cp.length > 1) g += `<polyline class="trace" points="${cp.map(q => f(q.X) + "," + f(q.Y)).join(" ")}"/>`;
  for (let j = 0; j < cp.length - 1; j++) {
    const u = cp[j], v = cp[j + 1];
    if (v.k !== u.k + 1) continue; // une pénalité s'intercale : pas de distance fiable
    const d = distanceM(u.lat, u.lng, v.lat, v.lng), px = Math.hypot(v.X - u.X, v.Y - u.Y);
    if (d >= 10 && px >= 40) g += `<text class="lbl" x="${f((u.X + v.X) / 2)}" y="${f((u.Y + v.Y) / 2 - 8)}">${Math.round(d)} m</text>`;
  }
  cp.forEach((q, j) => {
    if (j === cp.length - 1) g += `<circle class="halo" cx="${f(q.X)}" cy="${f(q.Y)}" r="13"/>`;
    g += `<circle class="marq${estPutt(q.club) ? " putt" : ""}" cx="${f(q.X)}" cy="${f(q.Y)}" r="8"/>`
      + `<text class="num" x="${f(q.X)}" y="${f(q.Y)}" dy=".35em">${q.k + 1}</text>`;
  });

  const bar = [10, 20, 50, 100, 200, 500].filter(v => v * s <= 110).pop() || 10, x2 = f(12 + bar * s);
  g += `<line class="echelle-fond" x1="12" y1="18" x2="${x2}" y2="18"/>`
    + `<line class="echelle" x1="12" y1="18" x2="${x2}" y2="18"/><line class="echelle" x1="12" y1="14" x2="12" y2="22"/>`
    + `<line class="echelle" x1="${x2}" y1="14" x2="${x2}" y2="22"/><text class="lbl gauche" x="12" y="11">${bar} m</text>`;
  if (!tourne) g += `<text class="lbl droite" x="${W - 12}" y="14">N ↑</text>`;

  return { vide: false, tourne, carte: !!CH,
    longueur: tourne && T && G ? distanceM(T.lat, T.lng, G.lat, G.lng) : null,
    html: `<svg class="plan" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan du trou ${n}">${g}</svg>` };
}

function cartePlan(p, i) {
  const n = i + 1, pl = planSvg(p, i);
  const lib = pt => pt ? (pt.acc != null ? "✓ ±" + pt.acc + " m" : pt.src === "osm" ? "✓ carte" : "✓ catalogue") : "à relever";
  const orient = pl.tourne ? `Tee à gauche, green à droite · tee → green ≈ ${Math.round(pl.longueur)} m.`
    : "Nord en haut : relève le tee et le green pour orienter le trou.";
  const mention = pl.carte
    ? ` Contours : © contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (sans relief ni arbres).`
    : " Schéma indicatif, sans relief ni obstacles.";
  const dg = ui.distGreen && ui.distGreen.trou === i
    ? `<p class="note"><b>Green à ≈ ${Math.round(ui.distGreen.d)} m</b> depuis l'endroit où tu étais au moment du calcul.</p>` : "";
  return `<section class="carte"><h2>Plan du trou</h2>
    ${pl.html}
    ${pl.vide ? "" : `<p class="note">${orient}${mention}</p>`}
    <div class="rangee trois">
      <button class="btn secondaire" data-action="relever" data-v="tee">Relever le tee<br><small>${lib(pointTrou(p.golfId, n, "tee"))}</small></button>
      <button class="btn secondaire" data-action="relever" data-v="green">Relever le green<br><small>${lib(pointTrou(p.golfId, n, "green"))}</small></button>
      <button class="btn secondaire" data-action="distGreen">Distance au green</button>
    </div>
    ${dg}</section>`;
}

function carteReleves() {
  return `<section class="carte"><h2>Relevés GPS</h2>
    <p class="note">Quand la carte du golf existe, le tee et le green en viennent déjà. Pour les corriger ou les compléter : place-toi sur le tee et appuie sur « Relever le tee », puis fais de même au centre du green. Tes relevés passent avant ceux de la carte. « Copier les positions relevées » permet ensuite de les ajouter au catalogue.</p>
    <button class="lien" data-action="copierReleves">Copier les positions relevées</button>
    <pre class="recap" id="recap-pos" style="display:none"></pre></section>`;
}

async function chargerContours(id) {
  const c = id && catGolf(id);
  if (!c || !c.contours || contoursEnCours.has(id)) return;
  contoursEnCours.add(id);
  try {
    const r = await fetch(c.contours, { cache: "no-cache" });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !Array.isArray(j.trous) || !Array.isArray(j.formes) || !Array.isArray(j.limite)) return;
    CONTOURS[id] = j;
    try { localStorage.setItem(CLE_CONTOURS, JSON.stringify(CONTOURS)); } catch (e) {}
    const a = document.activeElement;
    if (!a || a === document.body) render();
  } catch (e) { /* hors ligne : on garde les contours déjà enregistrés */ }
  finally { contoursEnCours.delete(id); }
}
// Contours du golf choisi et de la partie en cours
function prechargerContours() {
  const g = golfCourant() || listeGolfs()[0];
  if (g) chargerContours(g.id);
  if (S.partie) chargerContours(S.partie.golfId);
}

// Renvoie true si le catalogue a pu être chargé
async function chargerCatalogue() {
  try {
    const r = await fetch("golfs.json", { cache: "no-cache" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !Array.isArray(j.golfs) || !j.golfs.length) return false;
    S.catalogue = j.golfs;
    sauver();
    const a = document.activeElement;
    if (!a || a === document.body) render();
    prechargerContours();
    return true;
  } catch (e) { return false; /* hors ligne : on garde le catalogue déjà enregistré */ }
}

async function copierTexte(texte, preId, msg) {
  try { await navigator.clipboard.writeText(texte); toast(msg); }
  catch (e) {
    const r = document.getElementById(preId);
    if (r) { r.textContent = texte; r.style.display = "block"; }
    toast("Copie impossible : sélectionne le texte");
  }
}

/* ---------- Calculs ---------- */
function statsTrou(t) {
  const n = t.coups.length;
  const putts = t.coups.filter(c => estPutt(c.club)).length;
  const pen = t.coups.filter(c => c.club === PENALITE).length;
  const idxPutt = t.coups.findIndex(c => estPutt(c.club));
  const gir = idxPutt === -1 ? null : idxPutt <= t.par - 2;
  return { n, putts, pen, gir, diff: n - t.par, joue: n > 0 };
}

// Distance de chaque coup = écart entre sa position et celle du coup suivant (mesure GPS, indicative)
function distancesTrou(t) {
  return t.coups.map((c, k) => {
    const s = t.coups[k + 1];
    if (!s || c.club === PENALITE || s.club === PENALITE || c.lat == null || s.lat == null) return null;
    return distanceM(c.lat, c.lng, s.lat, s.lng);
  });
}

function calculs(p) {
  const lignes = p.trous.map(t => Object.assign({ t }, statsTrou(t)));
  const jouees = lignes.filter(l => l.joue);
  const somme = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const avecGir = jouees.filter(l => l.gir !== null);
  return {
    lignes,
    nbJouees: jouees.length,
    score: somme(jouees, l => l.n),
    par: somme(jouees, l => l.t.par),
    putts: somme(jouees, l => l.putts),
    pen: somme(jouees, l => l.pen),
    girOk: avecGir.filter(l => l.gir).length,
    girTotal: avecGir.length,
    birdies: jouees.filter(l => l.diff <= -1).length,
    pars: jouees.filter(l => l.diff === 0).length,
    bogeys: jouees.filter(l => l.diff === 1).length,
    doubles: jouees.filter(l => l.diff >= 2).length
  };
}

function statsClubs(p) {
  const m = new Map();
  p.trous.forEach(t => {
    const d = distancesTrou(t);
    t.coups.forEach((c, k) => {
      if (c.club === PENALITE) return;
      if (!m.has(c.club)) m.set(c.club, { n: 0, d: [] });
      const e = m.get(c.club);
      e.n++;
      if (!estPutt(c.club) && d[k] != null && d[k] >= 5 && d[k] <= 400) e.d.push(d[k]);
    });
  });
  const ordre = S.clubs;
  return [...m.entries()]
    .sort((a, b) => { const ia = ordre.indexOf(a[0]), ib = ordre.indexOf(b[0]); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); })
    .map(([club, e]) => ({ club, n: e.n, mesures: e.d.length, moy: e.d.length ? e.d.reduce((s, x) => s + x, 0) / e.d.length : null }));
}

function objectifTexte(p, c) {
  const o = parseInt(p.objectifScore, 10);
  if (isNaN(o)) return "";
  if (c.nbJouees < p.trous.length) return `Objectif : ${o} (comparaison possible quand les ${p.trous.length} trous sont saisis)`;
  const d = c.score - o;
  if (d === 0) return `Objectif de ${o} atteint pile`;
  if (d < 0) return `Objectif de ${o} atteint (${pluriel(-d, "coup")} d'avance)`;
  return `Objectif de ${o} manqué de ${pluriel(d, "coup")}`;
}

/* ---------- Géolocalisation d'un coup ---------- */
function localiser(coup, trou) {
  if (!navigator.geolocation) { coup.gps = "indispo"; sauver(); render(); return; }
  navigator.geolocation.getCurrentPosition(
    p => {
      coup.lat = p.coords.latitude; coup.lng = p.coords.longitude; coup.acc = p.coords.accuracy; coup.gps = "ok";
      sauver(); render(); retombee(coup, trou);
    },
    err => { coup.gps = err && err.code === 1 ? "refuse" : "echec"; sauver(); render(); },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 }
  );
}
// Où est tombé le coup précédent : distance entre sa position de départ et celle du coup qu'on vient de valider
function retombee(coup, trou) {
  const k = trou.coups.indexOf(coup);
  if (k < 1) return;
  const a = trou.coups[k - 1];
  if (a.club === PENALITE || a.lat == null) return;
  const d = distanceM(a.lat, a.lng, coup.lat, coup.lng);
  if (d >= 1) toast(`Coup précédent (${a.club}) : ≈ ${Math.round(d)} m`, 3500);
}
function libGps(c) {
  if (c.club === PENALITE) return "";
  if (c.gps === "ok") return `GPS ±${Math.round(c.acc)} m`;
  if (c.gps === "attente") return "GPS en cours…";
  if (c.gps === "refuse") return "GPS refusé";
  return "GPS indisponible";
}

function carteClubs() {
  const sel = new Set(S.clubs);
  const autres = S.clubs.filter(c => !CLUBS_CONNUS.includes(c));
  const groupes = CLUBS_GROUPES.concat(autres.length ? [["Autres", autres]] : []);
  const puce = c => `<button class="puce${sel.has(c) ? " on" : ""}" data-action="clubToggle" data-club="${esc(c)}" aria-pressed="${sel.has(c)}">${esc(c)}</button>`;
  return `<section class="carte"><h2>Mes clubs</h2>
    ${groupes.map(([nom, liste]) => `<div class="groupe-clubs"><div class="lib-groupe">${esc(nom)}</div><div class="puces">${liste.map(puce).join("")}</div></div>`).join("")}
    <p class="note">${pluriel(S.clubs.length, "club")} dans le sac (putter inclus). Touche un club pour l'ajouter ou le retirer : ils s'affichent sur la page Partie.</p>
  </section>`;
}

function vuePartie() {
  const p = S.partie, i = p.trouActif, t = p.trous[i];
  const st = statsTrou(t), dist = distancesTrou(t);
  const pastilles = p.trous.map((x, k) =>
    `<button class="pastille${k === i ? " actif" : ""}${x.coups.length ? " joue" : ""}" data-action="allerTrou" data-v="${k}" aria-label="Trou ${k + 1}">${k + 1}</button>`).join("");
  const choisi = S.clubs.includes(ui.clubChoisi) ? ui.clubChoisi : null;
  const boutons = S.clubs.map(c => `<button class="${estPutt(c) ? "putter" : ""}${c === choisi ? " sel" : ""}" data-action="club" data-club="${esc(c)}" aria-pressed="${c === choisi}">${esc(c)}</button>`).join("")
    + `<button class="pen" data-action="penalite">Pénalité +1</button>`;
  const mesure = dist.map((d, k) => ({ d, k })).filter(x => x.d != null && x.d >= 1).pop();
  const prec = mesure ? `<p class="prec">Coup précédent : <b>${esc(t.coups[mesure.k].club)}</b> · ≈ ${Math.round(mesure.d)} m</p>` : "";
  const liste = t.coups.length
    ? `<ul class="coups">${t.coups.map((c, k) => {
        const d = dist[k];
        return `<li class="coup"><span class="n">${k + 1}</span>
          <div><div class="l1"><b>${esc(c.club)}</b><span>${d != null && d >= 1 ? "≈ " + Math.round(d) + " m" : ""}</span></div>
          <span class="gps">${libGps(c)}</span></div>
          <button class="x" data-action="supprimerCoup" data-v="${k}" aria-label="Supprimer le coup ${k + 1}">×</button></li>`;
      }).join("")}</ul>`
    : `<p class="note">Aucun coup saisi sur ce trou.</p>`;
  const refus = t.coups.some(c => c.gps === "refuse")
    ? `<div class="alerte">Localisation refusée. Autorise-la dans Réglages > Confidentialité et sécurité > Service de localisation, puis rouvre la page.</div>` : "";
  const drills = p.drills.trim()
    ? `<details class="carte"><summary>Drills du jour</summary><ul class="liste-drills">${p.drills.trim().split(/\n+/).map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : "";

  return `<header class="page"><h1>${esc(p.golfNom)}</h1>
      <div class="sous">${esc(dateLongue(new Date(p.date)))}${p.objectifScore ? " · objectif " + esc(p.objectifScore) : ""}</div></header>

    <section class="carte"><div class="entete-trou">
      <button class="btn-nav" data-action="trouPrec" ${i === 0 ? "disabled" : ""} aria-label="Trou précédent">‹</button>
      <div class="num-trou"><div class="grand">${i + 1}</div><div class="petit">Trou · par ${t.par}${t.distance ? " · " + esc(t.distance) + " m" : ""}${t.hcp ? " · index " + t.hcp : ""}</div></div>
      <button class="btn-nav" data-action="trouSuiv" ${i === p.trous.length - 1 ? "disabled" : ""} aria-label="Trou suivant">›</button>
    </div></section>
    <div class="pastilles">${pastilles}</div>
    ${refus}
    <section class="carte"><h2>Quel club ?</h2>${prec}<div class="grille-clubs">${boutons}</div>
      <button class="btn principal plein" style="margin-top:12px" data-action="valider" ${choisi ? "" : "disabled"}>Valider le coup${choisi ? " · " + esc(choisi) : ""}</button>
      <p class="note">Choisis ton club, puis appuie sur « Valider le coup » à côté de ta balle, avant de frapper : ta position est enregistrée et indique où est tombé le coup précédent.</p></section>
    ${cartePlan(p, i)}
    <section class="carte">
      <div class="score-trou">
        <div><div class="gros">${st.n}</div><div class="sous">${pluriel(st.n, "coup")} · ${pluriel(st.putts, "putt")}</div></div>
        <div class="sous">${st.n ? (st.diff === 0 ? "Au par" : signe(st.diff) + " par rapport au par") : ""}</div>
      </div>${liste}</section>
    <section class="carte"><h2>Ce trou</h2>
      <div class="champ"><label>Par</label><div class="segment">
        ${[3, 4, 5, 6].map(v => `<button data-action="par" data-v="${v}" class="${t.par === v ? "on" : ""}">${v}</button>`).join("")}
      </div></div>
      <div class="champ"><label for="dist">Distance (m)</label>
        <input type="number" id="dist" inputmode="numeric" data-f="distance" value="${esc(t.distance)}" placeholder="Distance"></div>
      <p class="note">${catTrous(p.golfId) ? "Par et distance viennent du catalogue (départ " + esc(p.depart || "") + ") ; tes modifications ne valent que pour cette partie." : "Par et distance sont mémorisés pour ce golf."}</p></section>
    ${carteReleves()}`;
}

function barres(lignes) {
  const cols = lignes.map((l, k) => {
    let b = "";
    if (l.joue) {
      const d = Math.max(-2, Math.min(3, l.diff));
      b = d > 0 ? `<i class="b haut" style="height:${d * 20}px"></i>`
        : d < 0 ? `<i class="b bas" style="height:${-d * 20}px"></i>`
        : `<i class="b zero"></i>`;
    }
    return `<div class="bcol">${b}<span>${k + 1}</span></div>`;
  }).join("");
  return `<div class="barres">${cols}</div>`;
}

function vueSynthese() {
  const p = S.partie, c = calculs(p);
  const ecart = c.score - c.par;
  const obj = objectifTexte(p, c);
  const clubs = statsClubs(p);

  const lignes = c.lignes.map((l, k) =>
    `<tr><td class="g">${k + 1}</td><td>${l.t.par}</td><td>${l.joue ? l.n : "–"}</td><td>${l.joue ? l.putts : "–"}</td><td>${l.joue ? signe(l.diff) : ""}</td></tr>`).join("");

  const tabClubs = clubs.length
    ? `<table><thead><tr><th class="g">Club</th><th>Coups</th><th>Dist. moy. ≈</th></tr></thead><tbody>${clubs.map(x =>
        `<tr><td class="g">${esc(x.club)}</td><td>${x.n}</td><td>${x.moy != null ? Math.round(x.moy) + " m" : "–"}</td></tr>`).join("")}</tbody></table>
       <p class="note">Distances mesurées par GPS entre deux coups consécutifs : indicatives (précision d'environ 5 à 20 m). Putts exclus.</p>`
    : `<p class="note">Aucun coup saisi.</p>`;

  const drills = p.drills.trim()
    ? `<section class="carte"><h2>Drills du jour</h2><ul class="liste-drills">${p.drills.trim().split(/\n+/).map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>` : "";

  return `<header class="page"><h1>Synthèse</h1><div class="sous">${esc(p.golfNom)} · ${esc(dateLongue(new Date(p.date)))}</div></header>
    <section class="carte">
      <div class="tuiles">
        <div class="tuile"><div class="val">${c.score}</div><div class="lib">Score (${c.nbJouees}/${p.trous.length} trous)</div></div>
        <div class="tuile"><div class="val">${c.nbJouees ? signe(ecart) : "–"}</div><div class="lib">Écart au par</div></div>
        <div class="tuile"><div class="val">${c.putts}</div><div class="lib">Putts${c.nbJouees ? " · " + fmt(c.putts / c.nbJouees) + "/trou" : ""}</div></div>
        <div class="tuile"><div class="val">${c.girTotal ? c.girOk + "/" + c.girTotal : "–"}</div><div class="lib">Greens en rég. (estimé)</div></div>
        <div class="tuile"><div class="val">${c.pen}</div><div class="lib">Pénalités</div></div>
        <div class="tuile"><div class="val">${c.pars + c.birdies}</div><div class="lib">Pars ou mieux</div></div>
      </div>
      ${obj ? `<p class="note">${esc(obj)}</p>` : ""}
      <p class="note">L'écart au par est un calcul simplifié, ce n'est pas un index officiel.</p>
    </section>
    <section class="carte"><h2>Écart au par par trou</h2>${barres(c.lignes)}
      <p class="note">Au-dessus de la ligne : plus de coups que le par. En dessous : mieux que le par.</p></section>
    <section class="carte"><h2>Répartition</h2>
      <div class="tuiles" style="grid-template-columns:repeat(4,1fr)">
        <div class="tuile"><div class="val">${c.birdies}</div><div class="lib">Birdie ou mieux</div></div>
        <div class="tuile"><div class="val">${c.pars}</div><div class="lib">Pars</div></div>
        <div class="tuile"><div class="val">${c.bogeys}</div><div class="lib">Bogeys</div></div>
        <div class="tuile"><div class="val">${c.doubles}</div><div class="lib">Double ou +</div></div>
      </div></section>
    <section class="carte"><h2>Trou par trou</h2>
      <table><thead><tr><th class="g">Trou</th><th>Par</th><th>Coups</th><th>Putts</th><th>+/−</th></tr></thead>
      <tbody>${lignes}<tr class="total"><td class="g">Total</td><td>${c.par}</td><td>${c.score}</td><td>${c.putts}</td><td>${c.nbJouees ? signe(ecart) : ""}</td></tr></tbody></table></section>
    <section class="carte"><h2>Clubs</h2>${tabClubs}</section>
    ${drills}
    <section class="carte"><h2>Bilan</h2>
      <div class="champ"><label for="ressenti">Ressenti swing</label><input type="text" id="ressenti" data-f="ressenti" value="${esc(p.ressenti)}"></div>
      <div class="champ"><label for="priorite">Priorité prochaine séance</label><input type="text" id="priorite" data-f="priorite" value="${esc(p.priorite)}"></div>
      <div class="champ"><label for="notes">Notes</label><textarea id="notes" data-f="notes">${esc(p.notes)}</textarea></div>
    </section>
    <div class="rangee">
      <button class="btn principal" data-action="copier">Copier le récap</button>
      <button class="btn secondaire" data-action="copierJson">Copier les données brutes</button>
    </div>
    <pre class="recap" id="recap" style="display:none"></pre>
    <div class="rangee"><button class="btn danger" data-action="effacerPartie">Effacer cette partie</button></div>
    <p class="note">Les données restent sur cet appareil : pense à copier le récap vers ta base Notion en fin de partie.</p>`;
}

function recapTexte() {
  const p = S.partie, c = calculs(p);
  const L = [];
  L.push(`Séance Golf · ${new Date(p.date).toLocaleDateString("fr-FR")}`);
  L.push(`Parcours : ${p.golfNom}`);
  if (p.depart) L.push(`Départ : ${p.depart}`);
  L.push(`Type : Parcours`);
  L.push("");
  L.push(`Score : ${c.score} pour un par de ${c.par} (${c.nbJouees ? signe(c.score - c.par) : "–"}) sur ${pluriel(c.nbJouees, "trou")} joué${c.nbJouees > 1 ? "s" : ""}`);
  const obj = objectifTexte(p, c);
  if (obj) L.push(obj);
  L.push(`Putts : ${c.putts}${c.nbJouees ? " (" + fmt(c.putts / c.nbJouees) + " par trou)" : ""} · Pénalités : ${c.pen} · Greens en régulation (estimé) : ${c.girTotal ? c.girOk + "/" + c.girTotal : "–"}`);
  L.push(`Répartition : ${c.birdies} birdie ou mieux, ${c.pars} par, ${c.bogeys} bogey, ${c.doubles} double ou plus`);
  if (p.drills.trim()) L.push(`Drills à travailler : ${p.drills.trim().split(/\n+/).join(" ; ")}`);
  if (p.ressenti.trim()) L.push(`Ressenti swing : ${p.ressenti.trim()}`);
  if (p.priorite.trim()) L.push(`Priorité prochaine séance : ${p.priorite.trim()}`);
  if (p.notes.trim()) L.push(`Notes : ${p.notes.trim()}`);
  L.push("");
  L.push("Trou par trou");
  c.lignes.forEach((l, k) => {
    if (!l.joue) return;
    L.push(`T${k + 1} : par ${l.t.par} — ${pluriel(l.n, "coup")} (${signe(l.diff)}), ${pluriel(l.putts, "putt")} · ${l.t.coups.map(x => x.club).join(", ")}`);
  });
  const clubs = statsClubs(p);
  if (clubs.length) {
    L.push("");
    L.push("Clubs : " + clubs.map(x => `${x.club} ×${x.n}${x.moy != null ? " (≈ " + Math.round(x.moy) + " m)" : ""}`).join(" · "));
  }
  return L.join("\n");
}

/* ---------- Rendu ---------- */
function render(haut) {
  const y = window.scrollY;
  if (!golfCourant() && listeGolfs().length) S.golfId = listeGolfs()[0].id;
  const v = S.partie && (S.vue === "partie" || S.vue === "synthese") ? S.vue : "accueil";
  app.innerHTML = v === "partie" ? vuePartie() : v === "synthese" ? vueSynthese() : vueAccueil();
  document.querySelectorAll("#tabs button").forEach(b => {
    b.classList.toggle("actif", b.dataset.v === v);
    b.disabled = b.dataset.v !== "accueil" && !S.partie;
  });
  window.scrollTo(0, haut ? 0 : y);
  if (v === "partie") {
    const a = document.querySelector(".pastille.actif");
    if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest", inline: "center" });
  }
}

/* ---------- Actions ---------- */
function majGolfTrou() {
  const p = S.partie, t = p.trous[p.trouActif];
  if (catTrous(p.golfId)) return; // données du catalogue : on ne les écrase pas
  let g = S.golfs.find(x => x.id === p.golfId);
  if (!g) {
    const lg = listeGolfs().find(x => x.id === p.golfId);
    if (!lg) return;
    g = { id: lg.id, nom: lg.nom, nbTrous: lg.nbTrous, holes: lg.holes.map(h => Object.assign({}, h)), lat: lg.lat, lng: lg.lng };
    S.golfs.push(g);
  }
  if (g.holes[p.trouActif]) { g.holes[p.trouActif].par = t.par; g.holes[p.trouActif].distance = t.distance; }
}

const ACTIONS = {
  vue(b) { S.vue = b.dataset.v; sauver(); render(true); },
  async rechargerCatalogue() {
    ui.catMsg = "Chargement de la liste…"; render();
    const ok = await chargerCatalogue();
    ui.catMsg = ok ? "" : "Toujours impossible de charger la liste : vérifie ta connexion internet, puis réessaie.";
    render();
  },

  clubToggle(b) {
    const c = b.dataset.club;
    if (estPutt(c)) { toast("Le putter reste toujours dans le sac"); return; }
    S.clubs = ordonnerClubs(S.clubs.includes(c) ? S.clubs.filter(x => x !== c) : S.clubs.concat(c));
    sauver(); render();
  },

  async proche() {
    const avec = listeGolfs().filter(g => g.lat != null);
    if (!avec.length) {
      ui.proche = "Aucun golf de la liste n'a de position GPS : choisis ton golf dans la liste.";
      render(); return;
    }
    ui.proche = "Recherche de ta position…"; render();
    try {
      const p = await position();
      const l = avec.map(g => ({ g, d: distanceM(p.coords.latitude, p.coords.longitude, g.lat, g.lng) })).sort((a, b) => a.d - b.d)[0];
      const km = l.d / 1000;
      if (km <= 30) { S.golfId = l.g.id; sauver(); prechargerContours(); ui.proche = `Le plus proche : ${l.g.nom} (${fmt(km)} km). Tu peux en choisir un autre.`; }
      else ui.proche = `Aucun golf enregistré à moins de 30 km (le plus proche : ${l.g.nom}, ${fmt(km, 0)} km).`;
    } catch (e) {
      const c = e && e.code;
      ui.proche = c === 1 ? "Localisation refusée pour Safari : autorise-la dans les Réglages de l'iPhone, ou choisis ton golf dans la liste."
        : c === 3 ? "Délai dépassé : le signal GPS est faible. Réessaie à l'extérieur, ou choisis ton golf dans la liste."
        : c === 2 ? "Position introuvable : vérifie que le service de localisation est activé sur l'iPhone, ou choisis ton golf dans la liste."
        : "Localisation indisponible sur cet appareil : choisis ton golf dans la liste.";
    }
    render();
  },

  demarrer() {
    const g = golfCourant();
    if (!g) { toast("Choisis un golf"); return; }
    if (S.partie && !confirm("Une partie est déjà en cours. La remplacer par une nouvelle ?")) return;
    S.partie = {
      golfId: g.id, golfNom: g.nom, date: new Date().toISOString(), depart: departChoisi(g.id),
      objectifScore: S.objectifScore, drills: S.drills,
      trous: catTrous(g.id)
        ? catTrous(g.id).map(h => ({ par: h.par, distance: h.distances && h.distances[departChoisi(g.id)] != null ? String(h.distances[departChoisi(g.id)]) : "", hcp: h.hcp || null, coups: [] }))
        : g.holes.map(h => ({ par: h.par, distance: h.distance, coups: [] })),
      trouActif: 0, ressenti: "", priorite: "", notes: ""
    };
    ui.clubChoisi = null; S.vue = "partie"; sauver(); render(true);
    prechargerContours();
  },
  reprendre() { S.vue = "partie"; sauver(); render(true); },

  club(b) { ui.clubChoisi = ui.clubChoisi === b.dataset.club ? null : b.dataset.club; render(); },

  // Enregistre le coup tout de suite (rien n'est perdu si le GPS échoue), puis lui associe la position
  valider() {
    const c = ui.clubChoisi;
    if (!c || !S.clubs.includes(c)) { toast("Choisis d'abord un club"); return; }
    const t = S.partie.trous[S.partie.trouActif];
    const coup = { club: c, t: Date.now(), lat: null, lng: null, acc: null, gps: "attente" };
    t.coups.push(coup);
    ui.clubChoisi = null;
    sauver(); render();
    localiser(coup, t);
  },
  penalite() {
    S.partie.trous[S.partie.trouActif].coups.push({ club: PENALITE, t: Date.now(), lat: null, lng: null, acc: null, gps: "aucun" });
    sauver(); render();
  },
  supprimerCoup(b) { S.partie.trous[S.partie.trouActif].coups.splice(Number(b.dataset.v), 1); sauver(); render(); },
  par(b) { S.partie.trous[S.partie.trouActif].par = Number(b.dataset.v); majGolfTrou(); sauver(); render(); },
  trouPrec() { if (S.partie.trouActif > 0) { S.partie.trouActif--; ui.clubChoisi = null; sauver(); render(true); } },
  trouSuiv() { if (S.partie.trouActif < S.partie.trous.length - 1) { S.partie.trouActif++; ui.clubChoisi = null; sauver(); render(true); } },
  allerTrou(b) { S.partie.trouActif = Number(b.dataset.v); ui.clubChoisi = null; sauver(); render(true); },

  depart(b) { S.departs[S.golfId] = b.dataset.v; sauver(); render(); },

  async relever(b) {
    const p = S.partie, n = p.trouActif + 1, type = b.dataset.v;
    try {
      const pos = await position();
      const r = S.releves[p.golfId] || (S.releves[p.golfId] = {});
      const h = r[n] || (r[n] = {});
      h[type] = { lat: Math.round(pos.coords.latitude * 1e6) / 1e6, lng: Math.round(pos.coords.longitude * 1e6) / 1e6, acc: Math.round(pos.coords.accuracy) };
      sauver(); toast((type === "tee" ? "Tee" : "Green") + " du trou " + n + " relevé"); render();
    } catch (e) { toast(e && e.code === 1 ? "Localisation refusée" : "Position indisponible, réessaie"); }
  },

  async distGreen() {
    const p = S.partie, n = p.trouActif + 1, g = pointTrou(p.golfId, n, "green");
    if (!g) { toast("Green non relevé pour ce trou"); return; }
    try {
      const pos = await position();
      ui.distGreen = { trou: p.trouActif, d: distanceM(pos.coords.latitude, pos.coords.longitude, g.lat, g.lng) };
      render();
    } catch (e) { toast("Position indisponible, réessaie"); }
  },

  async copierReleves() {
    const p = S.partie, r = S.releves[p.golfId] || {};
    const trous = Object.keys(r).map(Number).sort((a, b) => a - b).map(n => ({ n, tee: r[n].tee, green: r[n].green }));
    if (!trous.length) { toast("Aucune position relevée"); return; }
    await copierTexte(JSON.stringify({ golf: p.golfId, trous }, null, 2), "recap-pos", "Positions copiées");
  },

  async copier() {
    const texte = recapTexte();
    try { await navigator.clipboard.writeText(texte); toast("Récap copié"); }
    catch (e) {
      const r = document.getElementById("recap");
      r.textContent = texte; r.style.display = "block";
      toast("Copie impossible : sélectionne le texte");
    }
  },
  async copierJson() {
    const texte = JSON.stringify(S.partie, null, 2);
    try { await navigator.clipboard.writeText(texte); toast("Données copiées"); }
    catch (e) {
      const r = document.getElementById("recap");
      r.textContent = texte; r.style.display = "block";
      toast("Copie impossible : sélectionne le texte");
    }
  },
  effacerPartie() {
    if (!confirm("Effacer cette partie ? Cette action est définitive.")) return;
    S.partie = null; ui.clubChoisi = null; S.vue = "accueil"; sauver(); render(true);
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const f = ACTIONS[b.dataset.action];
  if (f) f(b);
});

document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (!f || e.target.type === "checkbox") return;
  const v = e.target.value;
  switch (f) {
    case "objectifScore": S.objectifScore = v; break;
    case "drills": S.drills = v; break;
    case "ressenti": S.partie.ressenti = v; break;
    case "priorite": S.partie.priorite = v; break;
    case "notes": S.partie.notes = v; break;
    case "distance": S.partie.trous[S.partie.trouActif].distance = v; majGolfTrou(); break;
    default: return;
  }
  sauver();
});

document.addEventListener("change", e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (!f) return;
  if (f === "golfId") { S.golfId = e.target.value; ui.proche = ""; sauver(); render(); prechargerContours(); }
});

render();
chargerCatalogue();
</script>
</body>
</html>
